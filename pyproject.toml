[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "nmesh"
version = "0.2.0"
description = "Hardware-aware local LLM planner and runtime manager with an OpenAI-compatible gateway"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "shizukutanaka", email = "irosai.ume@gmail.com"}]
keywords = ["llm", "llama.cpp", "local-inference", "edge", "openai-compatible"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

requires-python = ">=3.10"
dependencies = [
  "httpx>=0.24",
  "psutil>=5.9",
  "pyyaml>=6.0",
  "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/shizukutanaka/n-"
Source = "https://github.com/shizukutanaka/n-"
Issues = "https://github.com/shizukutanaka/n-/issues"

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12.535"]
gateway = ["fastapi>=0.100", "uvicorn>=0.23"]
download = ["huggingface_hub>=0.20"]
dev = ["pytest>=7.0", "ruff>=0.1", "mypy>=1.5"]

[project.scripts]
nmesh = "nmesh.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["nmesh"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# winreg attributes only exist on Windows; the ignores are needed on other hosts.
module = ["nmesh.probe.generic_gpu"]
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
