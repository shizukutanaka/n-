name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # tests/conftest.py imports the gateway, and tests/test_acquisition.py
      # imports huggingface_hub, so collection fails without both extras.
      - run: pip install -e .[dev,gateway,download]
      - run: ruff check .
      - run: mypy nmesh
      - run: pytest -q
